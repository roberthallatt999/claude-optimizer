# vendor/skills.conf — third-party skills this repo pins, one row per source.
#
# Each skill is copied verbatim from its repo at the commit below. A change to the upstream
# text lives in vendor/patches/<name>.patch, applied after the copy, so it stays reviewable
# and fails loudly when upstream moves. scripts/vendor-skills.sh fetches and bumps; it never
# commits. Nothing here runs at deploy time: ai-config copies the committed result.
#
# Columns (whitespace-separated):
#   name    skill folder name (and frontmatter name)
#   tier    global          → global-skills/<name>/, linked into ~/.claude/skills/ on every machine
#           design[:gate]   → design-skills/<name>/, copied into a project's .claude/skills/ when
#                             design skills are on for that project (see setup-project.sh).
#                             gate = detected front-end library ids (detect-frontend.sh):
#                             "," means all of, "|" means any of. design:gsap,react = GSAP and React.
#   repo    https URL
#   commit  full 40-hex SHA
#   src     path in the repo: a file or a folder (copied as the skill folder)
#   dest    optional: where src lands inside the skill folder (default: the folder itself,
#           or SKILL.md for a file). Extra rows for the same name add files from other repos.
#
# Vetted 2026-11-11 (files read, nothing run). Rejected and why: Taste (39 MB generator with a
# Stop hook), Hallmark (refuses existing designs), UI/UX Pro Max (7 skills, stock palettes,
# plugin-root paths), Better Icons (wrapper for an unpinned npm tool that edits MCP config),
# React Bits (no free skill), skillui (hard-coded API key, sends URLs to a third party),
# Playwright CLI (the Playwright plugin covers it).

