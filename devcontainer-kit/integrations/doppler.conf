# Hosts for the Doppler CLI and API. No token is injected: a token for `doppler run` inside a
# sandbox should be a read-only, expiring service token for an agent-only dev config, and the
# values it injects reach processes Claude controls (docs/guides/sandbox.md, Doppler).
[integration]
description = Doppler secrets manager: CLI and API hosts (no token injected)

[hosts]
api.doppler.com
cli.doppler.com
packages.doppler.com

[deny]
Read(**/.doppler/**)
