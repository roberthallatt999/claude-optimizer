[integration]
description = Cloudflare: wrangler deploys for noslop's web pages, and the pages on the share domain
requires = share_domain

[image]
wrangler

[hosts]
api.cloudflare.com
; By name too, for tools that ignore the proxy (Playwright checking a published page)
{share_domain}

[credential]
variable = CLOUDFLARE_API_TOKEN
; cloudflare.sh's Keychain item for this profile (cloudflare-api-<profile>; cps keeps cloudflare-api)
keychain = {cloudflare_keychain}
scheme = bearer
hosts = api.cloudflare.com

[mount]
; Page records on a volume this profile's containers share; config and a placeholder token on top.
source = {cloudflare_dir}
target = {cloudflare_dir}
copy = config
placeholder = api-token
volume = {volume_prefix}-cloudflare-config

[skills]
noslop

[deny]
Read(**/.config/*cloudflare*/**/api-token)
Read(**/.config/cps-cloudflare/api-token)
