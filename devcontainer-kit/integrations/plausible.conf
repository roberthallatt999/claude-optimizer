[integration]
description = Plausible Analytics API (the plausible skill); the proxy adds the API key
requires = plausible_host

[hosts]
{plausible_host}

[credential]
variable = PLAUSIBLE_API_KEY
keychain = plausible-api
scheme = bearer
hosts = {plausible_host}

[mount]
; The Mac's config (host, sites), read-only, with the key file replaced by a placeholder.
source = ~/.config/plausible
target = ~/.config/plausible
copy = config
placeholder = api-key

[skills]
plausible

[deny]
Read(**/.config/plausible/api-key)
