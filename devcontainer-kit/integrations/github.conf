# Core: every sandbox gets it. git and gh work inside; the egress proxy adds the token.
[integration]
description = GitHub: git, gh, release assets, Actions logs and artifacts, container images

[hosts]
github.com
api.github.com
uploads.github.com
codeload.github.com
objects.githubusercontent.com
raw.githubusercontent.com
release-assets.githubusercontent.com
pipelines.actions.githubusercontent.com
results-receiver.actions.githubusercontent.com
ghcr.io
pkg-containers.githubusercontent.com

[credential]
variable = GITHUB_TOKEN
; Keychain service on the Mac (account = your macOS user): <profile>-devcontainer-github
keychain = {github_keychain}
scheme = github
hosts = github.com api.github.com uploads.github.com

[deny]
Read(**/.config/gh/**)
Bash(gh auth token:*)
Bash(gh repo delete:*)
