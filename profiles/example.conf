# profiles/example.conf — an ai-config profile: who you are in one context of your work.
#
# Real profiles hold names, organizations and domains, so they don't live in this public repo.
# Keep them in a private repo cloned to ~/.config/ai-config (see docs/guides/profiles.md):
#
#   ~/.config/ai-config/profiles/<name>.conf   one file per context (work, volunteer, side work)
#   ~/.config/ai-config/profile                 this machine's default, e.g. "work"
#   ~/.config/ai-config/skills/<skill>/         your own skills, linked into ~/.claude/skills/
#
# A project picks another profile with "profile = <name>" under [options] in its ai-config.conf.
# Read by global-skills/noslop/scripts/profile.sh. Unknown keys are ignored.

# Header line of a page: "From <name>, <organization> to …". Leave organization empty for
# personal work.
name = Jane Doe
organization = Example Society

# first-person-singular ("I") or first-person-plural ("we").
voice = first-person-singular

# Canadian, American or British.
spelling = Canadian

# Where noslop publishes web pages (a Cloudflare zone you control; see cloudflare.sh setup).
# Empty: build the page locally and publish nothing until asked.
share_domain = share.example.org

# Optional: tab icon, iPhone home-screen icon and link-preview image for published pages.
# Each must be a public https URL (not on the share domain), because everything under a page's
# address sits behind its passcode. The preview image is best at 1200x630. Empty or missing
# leaves the tag out.
favicon = https://www.example.org/favicon-32x32.png
touch_icon = https://www.example.org/apple-touch-icon.png
share_image = https://www.example.org/share-card.png

# Optional: the organization's look for noslop pages (rule 8 of the skill). With brand_primary
# unset, pages use the upstream Claude style kit. Logos must be public https URLs.
brand_primary = #1f3a68
brand_secondary = #2e7d4f
brand_tint = #fff7d6
brand_text = #1b2433
font_heading = Merriweather
font_body = Mulish
font_url = https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Mulish:wght@400;600;700;800&display=swap
logo_on_dark = https://www.example.org/logo-white.png
logo_on_light = https://www.example.org/logo.png
# light: always a white page, even on a dark device. auto (default): follow the device.
theme = light
# Readers who get a formal report (rule 9) instead of a one-page brief.
report_readers = management, the board, committees and policy documents

# Personal information that must never sit behind a shared passcode alone.
sensitive = members, patients, families or staff

# What noslop is not for: this context's site code follows its own brand rules.
not_for = the organization's website templates or site code

# Optional: use another profile's Cloudflare account and token, when this profile's
# share_domain lives in that account (e.g. two businesses publishing to one domain).
# cloudflare = other-profile

# Optional: the sandbox (ai-config --devcontainer; docs/guides/sandbox.md). Defaults for every
# project in this profile; a project's [sandbox] section in ai-config.conf adds or overrides.
# Integrations to switch on (devcontainer-kit/integrations/, or your own in
# ~/.config/ai-config/devcontainer/integrations/).
devcontainer_integrations = playwright, plausible, cloudflare
# Your organization's domains; a leading dot also allows every subdomain (through the proxy).
devcontainer_domains = .example.org
# Exact host names, for tools that ignore the proxy (production and staging sites).
devcontainer_hosts = example.org, staging.example.org
# Hosts to keep out even when a list allows them.
devcontainer_block =
# Settings integrations fill in.
plausible_host = stats.example.org
# Named in the sandbox's GitHub token advice.
github_org = example-org
