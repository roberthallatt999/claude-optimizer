# profiles/example.conf — an ai-config profile: who you are in one context of your work.
#
# Real profiles hold names, organizations and domains, so they don't live in this public repo.
# Keep them in a private repo cloned to ~/.config/ai-config (see docs/guides/profiles.md):
#
#   ~/.config/ai-config/profiles/<name>.conf   one file per context (work, volunteer, side work)
#   ~/.config/ai-config/profile                 this machine's default, e.g. "work"
#   ~/.config/ai-config/skills/<skill>/         your own skills, linked into ~/.claude/skills/
#
# A project picks another profile with "profile = <name>" under [options] in its ai-config.conf.
# Read by global-skills/noslop/scripts/profile.sh. Unknown keys are ignored.

# Header line of a page: "From <name>, <organization> to …". Leave organization empty for
# personal work.
name = Jane Doe
organization = Example Society

# first-person-singular ("I") or first-person-plural ("we").
voice = first-person-singular

# Canadian, American or British.
spelling = Canadian

# Where noslop publishes web pages (a Cloudflare zone you control; see cloudflare.sh setup).
# Empty: build the page locally and publish nothing until asked.
share_domain = share.example.org

# Personal information that must never sit behind a shared passcode alone.
sensitive = members, patients, families or staff

# What noslop is not for: this context's site code follows its own brand rules.
not_for = the organization's website templates or site code

# Optional: use another profile's Cloudflare account and token, when this profile's
# share_domain lives in that account (e.g. two businesses publishing to one domain).
# cloudflare = other-profile
