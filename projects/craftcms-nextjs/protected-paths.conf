# protected-paths.conf — Craft CMS (GraphQL) + Next.js
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

# Craft writes backups, logs and the security key into storage/
storage/backups/
storage/logs/
storage/runtime/validation.key

# On a Craft site a loose .sql file is a database dump, not a migration
*.sql

[ignore]

# Generated runtime state and compiled control-panel assets
storage/runtime/
web/cpresources/
web/imager/
web/assets/_*
.phpunit.cache/
frontend/.next/
frontend/.vercel/
frontend/out/
