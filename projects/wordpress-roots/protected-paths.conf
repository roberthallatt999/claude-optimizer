# protected-paths.conf — WordPress (Bedrock / Roots + Sage)
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

# Bedrock keeps credentials in .env (already denied) — these are the rest
config/environments/
web/app/backup*/
web/app/updraft/
*.sql

[ignore]

# WordPress core lives under web/wp on Bedrock
web/wp/

web/app/uploads/
web/app/cache/
web/app/upgrade/

# Sage compiled theme assets
web/app/themes/*/public/
web/app/themes/*/dist/
web/app/themes/*/storage/
