# protected-paths.conf — Craft CMS (GraphQL) + Nuxt 3
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

# Craft writes backups and the security key into storage/
storage/backups/
storage/runtime/validation.key

# On a Craft site a loose .sql file is a database dump, not a migration
*.sql

[ignore]

# Logs stay readable for debugging, which is Robert's call, not a hard block. The
# safety-guard content scan still denies any log holding a credential-shaped string.
storage/logs/

# Generated runtime state and compiled control-panel assets
storage/runtime/
web/cpresources/
web/imager/
web/assets/_*
.phpunit.cache/
frontend/.nuxt/
frontend/.output/
frontend/.data/
