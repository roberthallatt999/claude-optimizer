# protected-paths.conf — Astro + Strapi
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

# Strapi generates APP_KEYS, JWT and admin secrets into its own env
backend/.env
backend/.tmp/

[ignore]

.astro/
dist/
backend/build/
backend/.cache/
backend/.strapi/
backend/public/uploads/
backend/types/generated/
