# protected-paths.conf — Discovery mode (unknown stack)
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

# Discovery mode adds nothing beyond the universal baseline. Once the project's
# real stack is known, add its dumps and build output here (or switch to
# --stack=<name> and get that stack's list).

[deny]

[ignore]
