# protected-paths.conf — universal baseline, applied to every stack.
#
# Two tiers, because "protect" means two different things:
#
#   [deny]    Secrets, credentials, database dumps. Becomes a Read() deny rule in
#             .claude/settings.local.json AND a pattern the safety-guard hook blocks.
#             A hard stop — Claude cannot read these, and cannot cat them from Bash.
#
#   [ignore]  Build output, dependencies, binary assets. Token sinks, not secrets.
#             Written to .claudeignore only. NEVER denied: denying node_modules/
#             or dist/ breaks legitimate debugging.
#
# Pattern syntax (gitignore-like):
#   foo         a file or directory named foo, anywhere
#   foo/        the directory foo and everything under it, anywhere
#   *.sql       any file with that extension, anywhere
#   /foo/bar    anchored to the project root
#   foo/bar     that path segment, anywhere
#
# Stack files in projects/<stack>/protected-paths.conf add to this list; they never
# remove from it. A pattern may be promoted from [ignore] here to [deny] there
# (WordPress/EE/Craft do this with *.sql, where a .sql file is a dump, not source).

[deny]

# Environment and secret variables
.env
.env.*
*.env
.envrc

# Credential and secret stores
credentials*
secrets*
*.secret
*.token
*.password
.netrc
.git-credentials
.htpasswd

# Git internals — packed-refs and config carry remote credentials and tokens
.git/

# Database dumps, snapshots and binary databases
*.sqlite
*.sqlite3
*.db
*.dump
*.mdb
*.sql.gz
*.sql.zip
*.sql.bz2
*dump*.sql
*backup*.sql
dumps/
db_snapshots/

[ignore]

# Stale copies. Advisory, not denied: `mv config.php config.php.bak` is a routine
# Bash command, and the guard scans Bash tokens with the same matcher.
*.bak
*.old
*.orig

# Dependencies — readable when you need them, never worth loading by default
node_modules/
vendor/
bower_components/

# Build output and caches
dist/
build/
coverage/
.cache/
tmp/
temp/
*.min.js
*.min.css
*.map

# CI and repository metadata — editable, just not worth reading unprompted
.github/
.gitlab/

# Plain SQL. Overwhelmingly migrations in JS stacks (Prisma, Drizzle, Knex), so it
# stays advisory here; the CMS stacks promote it to [deny], where it means a dump.
*.sql

# Lockfiles — huge, and never worth reading in full
package-lock.json
pnpm-lock.yaml
yarn.lock
bun.lockb
composer.lock

# Binary and media assets
*.zip
*.tar
*.tar.gz
*.tgz
*.rar
*.7z
*.pdf
*.psd
*.ai
*.sketch
*.fig
*.mp4
*.mov
*.avi
*.mp3
*.wav
*.woff
*.woff2
*.ttf
*.eot
*.otf
*.jpg
*.jpeg
*.png
*.gif
*.webp
*.avif
*.ico

# Editor and OS noise
.DS_Store
Thumbs.db
.idea/
*.swp
