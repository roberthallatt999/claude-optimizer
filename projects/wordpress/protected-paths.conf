# protected-paths.conf — WordPress (classic)
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

# Database credentials, auth salts and table prefix
wp-config.php
wp-config-local.php
wp-salt.php

# Backup plugins drop full-site archives (database included) in wp-content
wp-content/backup*/
wp-content/ai1wm-backups/
wp-content/updraft/
wp-content/backups-dup-*/

# On a WordPress site a loose .sql file is a database dump, not a migration
*.sql

[ignore]

# WordPress core — vendor code, never edited
wp-admin/
wp-includes/

# Media library, caches and upgrade scratch space
wp-content/uploads/
wp-content/cache/
wp-content/upgrade/
wp-content/wflogs/
