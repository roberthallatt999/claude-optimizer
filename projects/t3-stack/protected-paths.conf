# protected-paths.conf — T3 Stack (Next.js + tRPC + Prisma)
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

.vercel/project.json

# Prisma's local dev database. Migrations under prisma/migrations/ stay readable:
# they are source, and *.sql is only advisory on JS stacks.
prisma/*.db
prisma/*.db-journal

[ignore]

.next/
.vercel/
out/
prisma/generated/
