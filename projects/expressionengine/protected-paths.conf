# protected-paths.conf — ExpressionEngine 7.x
#
# Adds to projects/common/protected-paths.conf; see that file for the tier rules.
# [deny] = hard block (Read() deny rule + safety-guard). [ignore] = .claudeignore only.

[deny]

# EE keeps the database credentials and encryption key here
system/user/config/
system/user/templates/*/._*

# On an EE site a loose .sql file is a database dump, not a migration
*.sql

[ignore]

# EE core and shipped themes — vendor code, never edited
system/ee/
themes/ee/

# Generated caches and member uploads
system/user/cache/
images/uploads/
images/avatars/
images/captchas/
images/member_photos/
images/pm_attachments/
